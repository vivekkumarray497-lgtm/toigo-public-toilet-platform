services:
  - type: web
    name: toigo-sanitation-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: toigo-sanitation-app

