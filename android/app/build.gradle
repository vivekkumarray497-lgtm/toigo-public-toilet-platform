plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.toigo.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.toigo.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystoreFile = file("release.keystore")
            if (System.getenv("KEYSTORE_FILE")) {
                keystoreFile = file(System.getenv("KEYSTORE_FILE"))
            }
            storeFile keystoreFile
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "toigo@2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "toigo-release"
            keyPassword System.getenv("KEY_PASSWORD") ?: "toigo@2026"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "BACKEND_URL", "\"https://toigo-sanitation-app.onrender.com\""
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def prodUrl = System.getenv("PROD_BACKEND_URL") ?: project.findProperty("PROD_BACKEND_URL") ?: "https://toigo-sanitation-app.onrender.com"
            buildConfigField "String", "BACKEND_URL", "\"${prodUrl}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'

    // Firebase BoM and Authentication
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-auth'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

tasks.register('syncWebAssets', Copy) {
    from("${rootDir}/..") {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'assets/**'
    }
    into("${projectDir}/src/main/assets/www")
}

preBuild.dependsOn(syncWebAssets)
